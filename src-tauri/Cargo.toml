[package]
name = "deltarune-save-manager"
version = "0.1.0"
description = "DELTARUNE 外置存档管理器"
authors = ["you"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "deltarune_save_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
chrono = { version = "0.4", features = ["clock"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
